<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escala Casa da Ovelhinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: uma coluna de domingos, cada domingo é um quadro reto com as 5 vagas como blocos tocáveis coloridos por turma */
:root{
  --surface:#ffffff; --ink:#000000; --ink-muted:#595959; --rule:#000000; --rule-soft:#d6d6d6;
  --surface-2:#f4f4f4; --accent:#fe671e; --on-accent:#000000;
  --ov-blue:#9ab9cd; --ov-red:#ee504d; --ov-yellow:#f1bc20; --ov-pink:#eb8ba7; --ov-teal:#4e938e;
  --on-fill:#000000;
  --font-display:"Titling Gothic FB Wide","Archivo","Arial Black",system-ui,sans-serif;
  --font-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --s1:8px; --s2:16px; --s3:32px; --s4:64px; --r-xs:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface:#000000; --ink:#ffffff; --ink-muted:#a8a8a8; --rule:#ffffff; --rule-soft:#333333; --surface-2:#141414; color-scheme:dark}}
:root[data-theme="dark"]{--surface:#000000; --ink:#ffffff; --ink-muted:#a8a8a8; --rule:#ffffff; --rule-soft:#333333; --surface-2:#141414; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s3)}
.logo{display:block;background:#fff;padding:var(--s1) 0}
.logo img{display:block;width:min(340px,80%);margin:0 auto}
.disp{font-family:var(--font-display);font-stretch:125%;font-weight:800;text-transform:uppercase;line-height:1.02;letter-spacing:0;text-wrap:balance;margin:0}
.sub{font-family:var(--font-display);font-stretch:125%;font-weight:400;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink-muted);margin:0}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.intro{display:grid;gap:var(--s2);margin-block:var(--s3) var(--s2)}
.intro h1{font-size:clamp(24px,6vw,36px)}
.intro p{margin:0;max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}
.me{display:flex;flex-wrap:wrap;gap:var(--s1);align-items:center;border:1px solid var(--rule-soft);padding:12px;margin-bottom:var(--s3)}
.me label{font-size:14px;color:var(--ink-muted)}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-xs);padding:8px 10px;min-width:0}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.me input{flex:1 1 180px}
.list{display:grid;gap:var(--s3)}
.sun{border-top:2px solid var(--rule);padding-top:var(--s2);display:grid;gap:var(--s2)}
.sun-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);flex-wrap:wrap}
.sun-date{display:flex;align-items:baseline;gap:12px}
.sun-date .disp{font-size:clamp(28px,7vw,40px)}
.pill{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px;border:1px solid var(--ink);white-space:nowrap}
.pill.ok{background:var(--ink);color:var(--surface)}
.pill.falta{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s1)}
.slot{appearance:none;font:inherit;text-align:left;cursor:pointer;border-radius:var(--r-xs);padding:10px 12px;min-height:72px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;border:2px dashed var(--ink-muted);background:transparent;color:var(--ink)}
.slot .t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.slot .t i{width:10px;height:10px;border-radius:50%}
.slot .n{font-weight:600;font-size:15px;word-break:break-word}
.slot.free .n{color:var(--ink-muted);font-weight:500}
.slot.taken{border:2px solid transparent;color:var(--on-fill)}
.slot.taken .t i{background:var(--on-fill)!important}
.slot:hover.free{border-color:var(--ink)}
.slot.sel{outline:2px solid var(--ink);outline-offset:2px}
.panel{border:1px solid var(--ink);padding:var(--s2);display:grid;gap:12px}
.panel p{margin:0}
.row{display:flex;flex-wrap:wrap;gap:var(--s1)}
.row input{flex:1 1 200px}
.btn{appearance:none;font:inherit;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:10px 16px;border-radius:var(--r-xs);border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:14px;color:var(--ink-muted)}
.more{margin-top:var(--s3);text-align:center}
.notice{border:1px solid var(--rule-soft);background:var(--surface-2);padding:var(--s2);font-size:15px}
footer{margin-top:var(--s4);padding-top:var(--s2);border-top:1px solid var(--rule-soft);display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-muted)}
.sym{width:28px;height:28px;border-radius:50%;background:#000;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sym img{width:28px;height:28px}
@media (prefers-reduced-motion: no-preference){.slot{transition:transform .12s}.slot:active{transform:scale(.98)}}
</style>
</head>

  <footer><span class="sym"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAYAAADimHc4AAACZUlEQVR42u1dy5LDMAgrTP//l7P3nWkbO4AElu67xhIvJw59vQRBEARBgMC6GHpd17W0MTOTAEVkdxbFppPOLoadRDqjGHYy8QxCWAfid4mpXo9WAJYOhrGTMhbyq8OfxS5DbxLdjaCFsFOJZ7HZqjfCfkKttt9F/pqN0S20VZDf5bkMYk8u8veiISoSXORjRXCRjxXBRT5WBBf5WBG8ysATRCgR4JPSJ5D/a687UeAiHyuCs4XkaenIn3q/8Iwrl/djo8Dl/dgocHk/NgpsR8mn5O9E1OqaFWtEcOXyXyxcuR9bC7w6TFULlIJ6pKCM4ntqFHxLQ4oA5iIsSAAJoPyf2w25+n/seUApSDVAAlAdzSUA4XG96m8QeLN3CR3WUQ1QChLapKCqN1WIN2JjI6Cqc0J0aEpBqgESQJAAEkBgEkDP/uO7qU+c6na0UhAPjjiIKb3dFGD1fgvTKZXNzm9O1yoF3SG2W616dwvZac2Ar+brCAKm1gF9H9DQKRyVBpiiIMKWtFEFahtzhfVqxf8biBYY6f23BUifnYkYGZws/t3/7SjlkSJErvWUg5BPPzPIC59OWGjjylohtw2yvZf1hkMEF4ZQfeqha4eHsM9UT3pfEOmEW0X4ZBGiM0D4sI7JImSkX680dCL5T5E2sGmSCJljOlNnxk0QIXtGatmJsFubWrWfsBpQPXd/AvmhEbBCNGs0IGy3CV7U2V6KZzgoMRjso/kdsUohmGwyNm/L2Dzz92LGGvaobqs6HcIKIVtbiqpD8E4ELQT8UkC3PnwC6bQCZAmiu02JAunLHUEQBKEr/gBJzcTLO/9HiQAAAABJRU5ErkJggg==" alt=""></span><span>Igreja Una Jaguariúna · Casa da Ovelhinha</span></footer>
</main>

<script>
(function(){
  const VAGAS=[
    {id:"bercario1",turma:"Berçário",cor:"var(--ov-blue)"},
    {id:"bercario2",turma:"Berçário",cor:"var(--ov-blue)"},
    {id:"maternal",turma:"Maternal",cor:"var(--ov-pink)"},
    {id:"juniores",turma:"Juniores",cor:"var(--ov-yellow)"},
    {id:"volante",turma:"Volante",cor:"var(--ov-teal)"}
  ];
  const MESES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  let semanas=8, dados={}, sel=null, conectado=false;
  async function api(method,body){
    const r=await fetch("/api/escala",{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error(j.erro||"falha"); e.status=r.status; e.info=j; throw e}
    return j;
  }
  async function carregar(){
    try{
      const j=await api("GET");
      const novo={}; Object.entries(j.vagas||{}).forEach(([k,v])=>{if(v&&v.nome&&v.data>=hojeIso)novo[k]=v.nome});
      const mudou=JSON.stringify(novo)!==JSON.stringify(dados);
      dados=novo; $("#status").hidden=true;
      if(!conectado||mudou){conectado=true; if(!document.querySelector(".panel input:focus")) render()}
    }catch(e){const st=$("#status"); st.hidden=false; st.textContent="Não foi possível carregar a escala. Confira a internet; a página tenta de novo sozinha."}
  }
  const $=s=>document.querySelector(s);
  const nomeIn=$("#meuNome");
  try{nomeIn.value=localStorage.getItem("ovelhinha_nome")||""}catch(e){}
  nomeIn.addEventListener("change",()=>{try{localStorage.setItem("ovelhinha_nome",nomeIn.value.trim())}catch(e){}});

  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  function domingos(n){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+((7-d.getDay())%7));
    const out=[]; for(let i=0;i<n;i++){out.push(new Date(d)); d.setDate(d.getDate()+7)} return out;
  }
  const hojeIso=iso(new Date());

  function render(){
    const lista=$("#lista"); lista.textContent="";
    domingos(semanas).forEach(dt=>{
      const dia=iso(dt);
      const preenchidas=VAGAS.filter(v=>dados[dia+"_"+v.id]).length;
      const sec=document.createElement("section"); sec.className="sun";
      const head=document.createElement("div"); head.className="sun-head";
      const dd=document.createElement("div"); dd.className="sun-date";
      const h=document.createElement("h2"); h.className="disp"; h.textContent=String(dt.getDate()).padStart(2,"0")+" "+MESES[dt.getMonth()];
      const s=document.createElement("span"); s.className="sub"; s.textContent="Domingo";
      dd.append(h,s);
      const pill=document.createElement("span");
      const faltam=VAGAS.length-preenchidas;
      pill.className="pill "+(faltam===0?"ok":"falta");
      pill.textContent=faltam===0?"Escala completa":(faltam===1?"Falta 1 vaga":"Faltam "+faltam+" vagas");
      head.append(dd,pill);
      const grid=document.createElement("div"); grid.className="slots";
      VAGAS.forEach(v=>{
        const key=dia+"_"+v.id, nome=dados[key];
        const b=document.createElement("button"); b.type="button";
        b.className="slot "+(nome?"taken":"free")+(sel===key?" sel":"");
        if(nome) b.style.background=v.cor;
        const t=document.createElement("span"); t.className="t";
        const i=document.createElement("i"); i.style.background=v.cor; t.append(i,document.createTextNode(v.turma));
        const n=document.createElement("span"); n.className="n"; n.textContent=nome||"+ Vaga livre";
        b.append(t,n);
        b.setAttribute("aria-label",v.turma+", "+(nome?"com "+nome:"vaga livre")+", "+h.textContent);
        b.addEventListener("click",()=>{sel=(sel===key?null:key); render()});
        grid.append(b);
      });
      sec.append(head,grid);
      if(sel && sel.startsWith(dia+"_")) sec.append(painel(sel, dt));
      lista.append(sec);
    });
  }

  function painel(key, dt){
    const v=VAGAS.find(x=>key.endsWith("_"+x.id)); const nome=dados[key];
    const p=document.createElement("div"); p.className="panel";
    const quando=String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0");
    const msg=document.createElement("p"); msg.className="msg";
    if(!conectado){
      const t=document.createElement("p"); t.textContent="A escala ainda está carregando. Espere um instante e toque de novo."; p.append(t); return p;
    }
    if(!nome){
      const t=document.createElement("p"); t.innerHTML="<strong></strong>"; t.firstChild.textContent=v.turma+" · domingo "+quando;
      const row=document.createElement("div"); row.className="row";
      const inp=document.createElement("input"); inp.id="nome_"+key; inp.type="text"; inp.maxLength=40; inp.placeholder="Seu nome"; inp.value=nomeIn.value;
      const ok=document.createElement("button"); ok.className="btn primary"; ok.type="button"; ok.textContent="Confirmar";
      const cancel=document.createElement("button"); cancel.className="btn"; cancel.type="button"; cancel.textContent="Cancelar";
      cancel.onclick=()=>{sel=null;render()};
      ok.onclick=async()=>{
        const n=inp.value.trim(); if(!n){msg.textContent="Escreva seu nome para confirmar.";return}
        ok.disabled=true; msg.textContent="Salvando…";
        try{nomeIn.value=n; localStorage.setItem("ovelhinha_nome",n)}catch(e){}
        try{
          await api("POST",{chave:key,data:iso(dt),turma:v.turma,nome:n});
          dados[key]=n; sel=null; render();
        }catch(e){
          if(e.status===409){dados[key]=(e.info&&e.info.nome)||"Preenchida"; render(); const m=document.querySelector(".panel .msg"); if(m) m.textContent="Esta vaga acabou de ser preenchida por "+dados[key]+". Escolha outra vaga."; return}
          msg.textContent=erro(e);ok.disabled=false
        }
      };
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")ok.click()});
      row.append(inp,ok,cancel); p.append(t,row,msg);
      setTimeout(()=>inp.focus(),0);
    }else{
      const t=document.createElement("p"); t.textContent=nome+" está na escala de "+v.turma+" no domingo "+quando+".";
      const row=document.createElement("div"); row.className="row";
      const rm=document.createElement("button"); rm.className="btn"; rm.type="button"; rm.textContent="Tirar este nome";
      const cancel=document.createElement("button"); cancel.className="btn"; cancel.type="button"; cancel.textContent="Fechar";
      cancel.onclick=()=>{sel=null;render()};
      rm.onclick=()=>{
        if(rm.dataset.conf){
          rm.disabled=true; msg.textContent="Removendo…";
          api("DELETE",{chave:key}).then(()=>{delete dados[key];sel=null;render()}).catch(e=>{msg.textContent=erro(e);rm.disabled=false});
        }else{rm.dataset.conf="1"; rm.textContent="Confirmar remoção"; rm.className="btn dark"; msg.textContent="A vaga volta a ficar livre."}
      };
      row.append(rm,cancel); p.append(t,row,msg);
    }
    return p;
  }

  function erro(e){
    if(e&&e.status===400) return "Confira o nome digitado e tente de novo.";
    if(e&&e.status===429) return "Muitas alterações seguidas. Espere alguns segundos e tente de novo.";
    return "Não foi possível salvar agora. Confira a internet e tente de novo.";
  }

  $("#maisBtn").onclick=()=>{semanas+=4;render()};
  render();

  carregar();
  setInterval(()=>{if(!document.hidden) carregar()},15000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) carregar()});
})();
</script>

</body>
